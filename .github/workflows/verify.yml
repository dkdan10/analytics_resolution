name: "verify: reduced gate + site build"

# Verifies; never publishes. A public clone has no raw dumps and none of the
# author's working notes, so the gate runs reduced and says what it skipped.
# Deploys happen from the author's machine with the full gate.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pinned pipeline libraries
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Acceptance gate, reduced (a public clone has no raw dumps)
        run: python pipeline/qa.py --no-raw

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Site dependencies
        working-directory: site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Gated site build (runs npm test and the public-data check); never deploys
        working-directory: site
        run: npm run build

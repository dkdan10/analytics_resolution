<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FADEAWAY</title>
    <style>
      :root {
        --ground: #0b0a09;
        --bone: #e8e2d6;
        --rail: 246px;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ground);
        overflow: hidden;
      }
      #app { display: flex; height: 100vh; }
      canvas { display: block; flex: 1 1 auto; min-width: 0; height: 100vh; }

      /* Exhibit mode: nothing on screen may look like it wants to be touched. */
      body.exhibit { cursor: none; }
      body.exhibit #nav { display: none; }

      /* The transport never scrolls: only the segment list does. A rail that
         scrolls its own controls away leaves the presenter without a mouse
         exactly when they are furthest from the start. */
      #nav {
        flex: 0 0 var(--rail);
        width: var(--rail);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
        padding: 18px 0 0;
        border-right: 1px solid rgba(232, 226, 214, 0.08);
        font-family: var(--mono);
        color: rgba(232, 226, 214, 0.55);
        font-size: 11px;
        line-height: 1.5;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 226, 214, 0.15) transparent;
      }
      #nav-head { flex: 0 0 auto; }
      #nav-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding-bottom: 24px;
        overscroll-behavior: contain;
      }
      #nav h1 {
        margin: 0 16px 2px;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        color: rgba(232, 226, 214, 0.8);
      }
      #nav .meta { margin: 0 16px 14px; color: rgba(232, 226, 214, 0.3); font-size: 10px; }

      .transport { display: flex; gap: 4px; margin: 0 12px 10px; }
      .transport button {
        flex: 1;
        background: transparent;
        border: 1px solid rgba(232, 226, 214, 0.12);
        color: rgba(232, 226, 214, 0.6);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 0;
        cursor: pointer;
        border-radius: 2px;
      }
      .transport button:hover { border-color: rgba(232, 226, 214, 0.35); color: var(--bone); }
      .transport button:active { background: rgba(232, 226, 214, 0.07); }

      /* Padding widens the grab area to ~15px without thickening the bar. */
      #scrub {
        margin: 0 16px 4px;
        height: 3px;
        padding: 6px 0;
        background: rgba(232, 226, 214, 0.1);
        background-clip: content-box;
        cursor: pointer;
        position: relative;
        touch-action: none;
      }
      #scrub .fill {
        position: absolute;
        inset: 6px auto 6px 0;
        background: rgba(232, 226, 214, 0.45);
      }
      #clock { margin: 0 16px 3px; font-size: 10px; color: rgba(232, 226, 214, 0.32); }
      #hand {
        display: block;
        width: calc(100% - 32px);
        margin: 0 16px 12px;
        padding: 0;
        text-align: left;
        background: transparent;
        border: 0;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: rgba(232, 226, 214, 0.5);
        cursor: pointer;
      }
      #hand:hover { color: var(--bone); }

      /* The keys, said where the presenter is already looking. */
      #keys {
        margin: 0 16px 14px;
        font-size: 9px;
        line-height: 1.7;
        letter-spacing: 0.06em;
        color: rgba(232, 226, 214, 0.26);
      }
      #keys p { margin: 0; }

      /* Every control in the rail is reachable from the keyboard, so every
         control has to SHOW that it has focus. Bone, not the browser's blue. */
      #nav :focus-visible {
        outline: 1px solid rgba(232, 226, 214, 0.65);
        outline-offset: 1px;
      }
      #nav :focus:not(:focus-visible) { outline: none; }

      .act {
        margin: 14px 16px 4px;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(232, 226, 214, 0.42);
        border-top: 1px solid rgba(232, 226, 214, 0.07);
        padding-top: 8px;
      }
      /* A real button, so it is in the tab order and answers Enter and Space.
         The reset is what keeps it looking like a row in a list. */
      .seg {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        padding: 2px 16px;
        background: transparent;
        border: 0;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .seg:hover { background: rgba(232, 226, 214, 0.05); color: var(--bone); }
      .seg .share { color: rgba(232, 226, 214, 0.32); font-variant-numeric: tabular-nums; }
      .seg.current { background: rgba(232, 226, 214, 0.1); color: var(--bone); }
      .seg.current .share { color: rgba(232, 226, 214, 0.7); }
      /* A mark for the seasons where the record's own resolution changes. */
      .seg .mark { color: rgba(232, 226, 214, 0.28); width: 1.2em; display: inline-block; }
      .seg.window .mark, .seg.cut .mark { color: rgba(232, 226, 214, 0.7); }
      /* The window's four beats: the only sub-list in the rail, because the
         window is the only segment long enough to have an inside. */
      .seg.beat {
        padding-left: 40px;
        font-size: 11px;
        color: rgba(232, 226, 214, 0.42);
      }
      .seg.beat .share { color: rgba(232, 226, 214, 0.22); }

      /* The only thing a viewer should ever see go wrong. Composed, on the
         plate's own ground, in the plate's own type - a gallery wall may not
         carry a crash report. The reason is appended only in the working and
         lectern modes; see `fault` in main.ts. */
      #fault {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 0;
        background: var(--ground);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.22em;
        color: rgba(232, 226, 214, 0.42);
        text-align: center;
      }
      #fault p { margin: 0; }
      #fault .fault-title { color: rgba(232, 226, 214, 0.7); }
      #fault .fault-why {
        max-width: 60ch;
        letter-spacing: 0.04em;
        color: rgba(232, 226, 214, 0.3);
      }
    </style>
  </head>
  <!-- Chrome-free from the first paint: the rail removes this class if it is
       wanted, so a gallery machine never flashes a cursor while data loads. -->
  <body class="exhibit">
    <div id="app">
      <aside id="nav" hidden></aside>
      <canvas id="plate"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
